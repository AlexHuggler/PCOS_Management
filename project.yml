name: PCOS
options:
  bundleIdPrefix: alex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  ScannerCanary: release

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.43.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "18"
    DEVELOPMENT_TEAM: 2PW989LA87
    CODE_SIGN_STYLE: Automatic

targets:
  PCOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      ScannerCanary: Config/ScannerCanary.xcconfig
    sources:
      - path: PCOS/PCOS
        excludes:
          - "**/.DS_Store"
          - "**/.gitkeep"
          - "**/README.md"
          - "Resources/Assets.xcassets"
          - "Info.Release.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: alex.PCOS
        PRODUCT_NAME: PCOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: PCOS/PCOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: CycleBalance
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          CODE_SIGN_ENTITLEMENTS: PCOS/PCOS.debug.entitlements
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
          SWIFT_COMPILATION_MODE: wholemodule
          CODE_SIGN_ENTITLEMENTS: PCOS/PCOS.entitlements
          INFOPLIST_FILE: PCOS/PCOS/Info.Release.plist
          INFOPLIST_PREPROCESS: "YES"
          INFOPLIST_PREPROCESSOR_DEFINITIONS: "$(inherited) MEAL_SCAN_RELEASE_UI_ENABLED_$(MEAL_SCAN_RELEASE_UI_ENABLED)=1 MEAL_SCAN_RELEASE_GEMINI_ENABLED_$(MEAL_SCAN_RELEASE_GEMINI_ENABLED)=1"
          # Audited archive policy. Only UI and Gemini are signed runtime gates;
          # both remain fail-closed until every documented release gate passes.
          MEAL_SCAN_RELEASE_UI_ENABLED: "NO"
          MEAL_SCAN_RELEASE_GEMINI_ENABLED: "NO"
          MEAL_SCAN_RELEASE_MOCK_DATA_ENABLED: "NO"
          MEAL_SCAN_RELEASE_DEBUG_DIRECT_ENABLED: "NO"
          MEAL_SCAN_RELEASE_FALLBACK_MODEL_ENABLED: "NO"
          MEAL_SCAN_RELEASE_SIMILARITY_ENABLED: "NO"
          USDA_FDC_API_KEY: ""
        ScannerCanary:
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
          SWIFT_COMPILATION_MODE: wholemodule
          CODE_SIGN_ENTITLEMENTS: PCOS/PCOS.entitlements
          INFOPLIST_FILE: PCOS/PCOS/Info.Release.plist
          INFOPLIST_PREPROCESS: "YES"
          INFOPLIST_PREPROCESSOR_DEFINITIONS: "$(inherited) MEAL_SCAN_RELEASE_UI_ENABLED_$(MEAL_SCAN_RELEASE_UI_ENABLED)=1 MEAL_SCAN_RELEASE_GEMINI_ENABLED_$(MEAL_SCAN_RELEASE_GEMINI_ENABLED)=1"
          USDA_FDC_API_KEY: ""
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck

  PCOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PCOS/PCOSTests
        excludes:
          - "**/.DS_Store"
          - ProductionMealScanAppCheckProbeTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: alex.PCOSTests
        PRODUCT_NAME: PCOSTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PCOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PCOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: PCOS

  PCOSProductionProbeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PCOS/PCOSTests/ProductionMealScanAppCheckProbeTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: alex.PCOSProductionProbeTests
        PRODUCT_NAME: PCOSProductionProbeTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PCOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PCOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: PCOS

  PCOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PCOS/PCOSUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: alex.PCOSUITests
        PRODUCT_NAME: PCOSUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: PCOS
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: PCOS

schemes:
  PCOS:
    build:
      targets:
        PCOS: all
        PCOSTests: [test]
        PCOSUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-billing.backendMode": true
        "revenuecat": true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PCOSTests
        - name: PCOSUITests
    archive:
      config: Release

  PCOS Local StoreKit:
    build:
      targets:
        PCOS: all
        PCOSTests: [test]
        PCOSUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: PCOS/PCOS/StoreKit/PCOS.storekit
      commandLineArguments:
        "-billing.backendMode": true
        "local_storekit": true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PCOSTests
        - name: PCOSUITests
    archive:
      config: Release

  PCOS General Kenobi Scanner Canary:
    build:
      targets:
        PCOS: all
    run:
      config: ScannerCanary
      commandLineArguments:
        "-billing.backendMode": true
        "revenuecat": true
    profile:
      config: ScannerCanary
    analyze:
      config: ScannerCanary
    archive:
      config: Release

  PCOS Production Meal Scan Probe:
    build:
      targets:
        PCOS: all
        PCOSProductionProbeTests: [test]
    run:
      config: Release
    test:
      config: Release
      gatherCoverageData: false
      environmentVariables:
        RUN_PRODUCTION_MEAL_SCAN_INTEGRATION: "1"
      targets:
        - name: PCOSProductionProbeTests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
